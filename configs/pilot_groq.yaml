# PILOT-ONLY CONFIG (2026-11-07). Not the registered study config.
# KEYUR chose a small Groq-only pilot because OpenRouter, the Hugging Face router and
# Ollama were not reachable from the run environment, and Groq retired the Llama models.
# Deviations from study.yaml are listed in DEVIATIONS_PILOT.md. Development items only.
study:
  title: Who gains most from AI? Logical reasoning as an amplifier of LLM-assisted performance
  seed: 20261026
  dev_seed: 7110526
  error_rate: 0.5
  modes:
  - direct
  - brief
  - careful
  equivalence_bound_pp: 5.0
  primary_outcome: gain
  alpha: 0.05
  bootstrap_reps: 9999
  collapse_share: 0.9
  max_unparsed: 0.2
  max_api_fail: 0.1
  surface_auc_max: 0.65
  max_tokens:
    direct: 64
    brief: 384
    careful: 1536
    assistant: 1024
route: api
profiles:
  # "full" is kept only so the lock check can confirm pilot items never overlap the registered items.
  full: {assistants: real, benchmarks: {folio: 200, gsm8k: 300, logiqa: 300, mmlu: 400}, item_set: registered, items: {catch: 24, conditional: 80, crt: 30, easy_math: 200, hard_deduction: 300, logic_creative: 40, syllogism: 120}, solvers: real}
