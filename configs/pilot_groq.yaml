      conditional: 24
      crt: 12
      easy_math: 40
      hard_deduction: 60
      logic_creative: 8
      catch: 12
    benchmarks:
      folio: 40
      logiqa: 40
      gsm8k: 40
      mmlu: 80
    solvers: real
    assistants: real
    item_set: dev
