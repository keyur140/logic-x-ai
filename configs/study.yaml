# Study configuration. Frozen at preregistration: its SHA-256 goes into the
# OSF registration, and every run copies it into the run folder.

study:
  title: "Who gains most from AI? Logical reasoning as an amplifier of LLM-assisted performance"
  seed: 20261026            # REGISTERED seed: the confirmatory items. Locked until the freeze.
  dev_seed: 7110526         # development seed: pilot and exploratory items only (never registered)
  error_rate: 0.5           # share of hard_deduction items with a planted assistant error
  modes: [direct, brief, careful]   # 28 models x 3 modes = 84 solvers
  equivalence_bound_pp: 5.0 # H2: |slope| < 5 percentage points of AI gain per 1 SD logic
  primary_outcome: gain     # decision 14: gain score (with AI minus alone) for H1, H2, H4; ANCOVA = sensitivity
  alpha: 0.05
  bootstrap_reps: 9999
  collapse_share: 0.90      # G2: exclude a solver giving one answer on >90% of a choice family
  max_unparsed: 0.20        # G3: exclude a solver with >20% unreadable answers in a family
  max_api_fail: 0.10        # G3: exclude a solver with >10% API failures after retries
  surface_auc_max: 0.65     # G5: planted vs clean assistant replies must not be separable by surface features

  max_tokens: {direct: 64, brief: 384, careful: 1536, assistant: 1024}

# Where models run. "api": free APIs first, Ollama as backup (USD 0, slower, versions not pinned).
# "local": every model through Ollama (own PC or one rented GPU); each model pinned by its digest.
route: api

# Item counts per profile. "pilot" = small first run to check timing and
# ceiling/floor effects (like the pilot in the original plan). "full" = registered study.
profiles:
  # Synthetic exploratory run at full study scale (offline, simulated models, dev seed).
  mock:
    items: &full_items {syllogism: 120, conditional: 80, crt: 30, easy_math: 200, hard_deduction: 300, logic_creative: 40, catch: 24}
    benchmarks: &full_bench {folio: 200, logiqa: 300, gsm8k: 300, mmlu: 400}
    solvers: mock
    assistants: mock
    world: amplify          # planted effect: logic raises error-catching
    item_set: dev
  mock_null:
    items: *full_items
    benchmarks: *full_bench
    solvers: mock
    assistants: mock
    world: "null"           # no effect: error-catching does not depend on logic
    item_set: dev
  mock_quick:               # small offline smoke test (about 1 minute)
    items: {syllogism: 36, conditional: 24, crt: 12, easy_math: 40, hard_deduction: 60, logic_creative: 8, catch: 12}
    benchmarks: {folio: 30, logiqa: 30, gsm8k: 30, mmlu: 60}
    solvers: mock
    assistants: mock
    world: amplify
    item_set: dev
  pilot:                    # real models, dev items: timing, parsing, ceiling/floor
    items: {syllogism: 36, conditional: 24, crt: 12, easy_math: 40, hard_deduction: 60, logic_creative: 8, catch: 12}
    benchmarks: {folio: 40, logiqa: 40, gsm8k: 40, mmlu: 80}
    solvers: real
    assistants: real
    solver_limit: 6
    item_set: dev
  full:                     # the registered study; refuses to run unless MATCHES_FREEZE
    items: *full_items
    benchmarks: *full_bench
    solvers: real
    assistants: real
    item_set: registered

# Hugging Face dataset revisions. Leave empty to resolve and record at run time;
# fill in before the full run so the exact data are pinned.
benchmark_revisions: {folio: "", logiqa: "", gsm8k: "", mmlu: ""}

# The assistant AIs (decision 5: Llama primary, Qwen replication).
# Each has a primary route and a backup route; the run manifest records which one answered.
assistants:
  - {alias: llama-3.3-70b, provider: groq, model_id: llama-3.3-70b-versatile,
     fallback_provider: openrouter, fallback_model_id: "meta-llama/llama-3.3-70b-instruct:free", params_b: 70,
     ollama_tag: "llama3.3:70b"}
  - {alias: qwen-2.5-72b, provider: openrouter, model_id: "qwen/qwen-2.5-72b-instruct:free",
     fallback_provider: huggingface, fallback_model_id: "Qwen/Qwen2.5-72B-Instruct", params_b: 72,
     ollama_tag: "qwen2.5:72b"}

# The 28 solver models: open weights, a wide spread of sizes and families.
# Small models run locally with Ollama (free); larger ones can use an API route.
# params_b = billions of parameters (used as a control, decision 8).
